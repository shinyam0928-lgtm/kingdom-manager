<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>キングダム頂天攻略ツール</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    margin:0;
    background:#f5f5f5;
    color:#333;
}

header{
    background:#8b0000;
    color:white;
    padding:15px;
    text-align:center;
}

h1{
    margin:0;
    font-size:22px;
}

.container{
    padding:15px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:10px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #ccc;
}

.checkbox{
    transform:scale(1.3);
    margin-right:10px;
}

.tag{
    display:inline-block;
    background:#ddd;
    padding:3px 8px;
    border-radius:15px;
    font-size:12px;
    margin-left:5px;
}

.count{
    font-weight:bold;
    color:#8b0000;
}

button{
    background:#8b0000;
    color:white;
    border:none;
    padding:10px;
    border-radius:8px;
}

</style>
</head>


<body>

<header>
<h1>キングダム頂天 攻略ツール</h1>
</header>


<div class="container">


<div class="card">

<h2>SSRシーンカード管理</h2>

<p>
所持カード：
<span class="count" id="count">0</span>枚
</p>

<input 
id="search"
placeholder="カード名を検索"
oninput="searchCard()">

</div>



<div id="cardList"></div>



</div>



<script>


// SSRカードデータ
// 今後Game8正式名称を追加

const cards=[

{
name:"王騎の号令",
type:"SSR",
use:"王騎・信系 火力強化"
},

{
name:"飛信隊出陣",
type:"SSR",
use:"信編成向け"
},

{
name:"六大将軍の威光",
type:"SSR",
use:"汎用火力"
},

{
name:"趙軍総大将の策",
type:"SSR",
use:"李牧向け"
},

{
name:"秦軍の結束",
type:"SSR",
use:"秦編成"
}

];



let owned=
JSON.parse(localStorage.getItem("kingdomCards")||"[]");



function save(){

localStorage.setItem(
"kingdomCards",
JSON.stringify(owned)
);

updateCount();

}



function updateCount(){

document.getElementById("count").innerText=
owned.length;

}



function display(list){


let area=document.getElementById("cardList");

area.innerHTML="";


list.forEach((c,index)=>{


let checked=
owned.includes(c.name)
?"checked":"";


area.innerHTML+=`

<div class="card">

<label>

<input 
class="checkbox"
type="checkbox"
${checked}
onclick="toggle('${c.name}')">

<b>${c.name}</b>

<span class="tag">${c.type}</span>

</label>


<p>
用途：${c.use}
</p>


</div>

`;

});


}



function toggle(name){

if(owned.includes(name)){

owned=
owned.filter(x=>x!==name);

}else{

owned.push(name);

}


save();

display(cards);

}




function searchCard(){

let text=
document.getElementById("search").value;


let result=
cards.filter(c=>
c.name.includes(text)
);


display(result);

}



display(cards);

updateCount();


</script>


</body>
</html>
